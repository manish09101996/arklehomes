<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Yellow badge background matching screenshot -->
  <rect x="10" y="8" width="260" height="124" rx="14" fill="#EEA727" filter="url(#subtle-shadow)"/>
  
  <!-- Outer subtle border -->
  <rect x="14" y="12" width="252" height="116" rx="10" fill="none" stroke="#D9941C" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- House roof silhouette with tree emblem inside -->
  <g transform="translate(140, 44)" fill="#0C1B23">
    <!-- Roof gable -->
    <path d="M-22,6 L0,-16 L22,6 L17,6 L0,-11 L-17,6 Z" />
    <path d="M-15,6 L-15,16 L15,16 L15,6 L11,6 L11,13 L-11,13 L-11,6 Z" />
    <!-- Tree / branch emblem inside house -->
    <path d="M0,13 L0,-4 M0,-1 C-3,-4 -6,-2 -7,-5 C-7,-8 -3,-7 0,-4 C3,-7 7,-8 7,-5 C6,-2 3,-4 0,-1 M0,5 C-4,2 -7,4 -8,1 C-8,-2 -4,-1 0,2 C4,-1 8,-2 8,1 C7,4 4,2 0,5" stroke="#0C1B23" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography matching exact brand from screenshot -->
  <text x="140" y="94" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-weight="900" font-size="25" fill="#0C1B23" letter-spacing="1.5" text-anchor="middle">ARKLE HOMES</text>
  <text x="140" y="112" font-family="'Plus Jakarta Sans', 'Inter', 'Arial', sans-serif" font-weight="700" font-size="9" fill="#182E38" letter-spacing="4" text-anchor="middle">BUILDING SERVICES</text>
</svg>
